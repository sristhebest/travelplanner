<body>
<iframe id="app" title="旅遊規劃" allow="clipboard-read; clipboard-write"></iframe>
<script>
  /* ▼▼▼ 把下面這行引號裡的網址，換成你的 Apps Script 網頁網址（結尾是 /exec） ▼▼▼ */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyFEe8zFzjLTGB3UKcghztcKsxklpg1oLVFljju0mHeEm86JdkpNR1SC3Q1bR4vvb3m/exec';
  /* ▲▲▲ 其他地方都不用改 ▲▲▲ */

  /* 把網址後面的 ?trip=… 或 ?owner=… 一起帶進去 */
  document.getElementById('app').src = APP_URL + location.search;

  /* 裡面切換旅程時，同步更新這一頁的網址（擁有者連結的 owner 會自動從網址列拿掉，避免誤傳給旅伴） */
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'tripPlanner') return;
    var q = d.trip ? '?trip=' + encodeURIComponent(d.trip) : '';
    history.replaceState(null, '', location.pathname + q);
  });
</script>
</body>
